# Publishes the trimmed tools the server image copies in: ffprobe reads files,
# ffmpeg turns them into pixels, and stratus-embed runs the model a search by
# content reads photographs with (#505).
#
# Separate from ci.yml on purpose: this compiles C, and doing it in the server
# Dockerfile would put a cross-architecture build on every commit. Here it runs
# only when a recipe or an FFmpeg version changes, which is roughly never, and
# the server build stays two COPYs.
name: media tools

on:
  workflow_dispatch:
    inputs:
      tools:
        # Which to build, as JSON, so that publishing one from a branch does
        # not rebuild and repush the others' architecture tags.
        description: 'the tools to build, as a JSON list'
        default: '["ffprobe", "ffmpeg", "embed"]'
  push:
    branches: [main]
    paths: ['build/ffprobe/**', 'build/ffmpeg/**', 'build/embed/**', '.github/workflows/media-tools.yml']

permissions:
  contents: read
  packages: write

jobs:
  # Two dimensions: the tool and the architecture. One native runner per
  # architecture rather than one runner emulating the other, because FFmpeg is a
  # C build and under QEMU it takes long enough to need a timeout nobody wants
  # to reason about. Each job pushes its own architecture under a suffixed tag
  # and the manifest is assembled afterwards.
  build:
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(inputs.tools || '["ffprobe", "ffmpeg", "embed"]') }}
        arch: [amd64, arm64]
        # arch is a matrix key and not only an include value, so each of these
        # merges into the combinations whose arch matches. Naming the platform
        # and the runner in an include that carried neither would fuse both
        # entries into every combination, and the last one would win: two jobs
        # on the same architecture and nothing built for the other.
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: version and image
        id: v
        env:
          OWNER: ${{ github.repository_owner }}
          TOOL: ${{ matrix.tool }}
        run: |
          # The FFmpeg tools are tagged by the FFmpeg they are; stratus-embed by
          # its own count, since main.cc changes without ONNX Runtime moving.
          var=FFMPEG_VERSION
          [ "$TOOL" = embed ] && var=EMBED_VERSION
          version="$(sed -n "s/^ARG $var=//p" "build/$TOOL/Dockerfile")"
          [ -n "$version" ] || { echo "no $var in build/$TOOL/Dockerfile"; exit 1; }
          # A registry repository name has to be lowercase and the owner is not.
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=$version"
            echo "image=ghcr.io/$owner/stratus-$TOOL"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --platform is stated rather than left to the runner so that a runner on
      # the wrong architecture fails here instead of quietly emulating.
      - name: build ${{ matrix.tool }} ${{ matrix.arch }}
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --tag "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}-${{ matrix.arch }}" \
            --load "build/${{ matrix.tool }}"

      # The models are converted once, on arm64, and this is what says the same
      # bytes give the same outputs under the helper built for each
      # architecture: internal/embed's tests, against the assets as published.
      - name: check stratus-embed ${{ matrix.arch }} against the published models
        if: matrix.tool == 'embed'
        # bash by name, which is what brings pipefail: without it a failing
        # go test behind tee passed this step and the image was pushed.
        shell: bash
        env:
          IMAGE: ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}-${{ matrix.arch }}
        run: |
          field() { sed -n "/^var $1 = Bundle{/,/^}/s/^\t$2: *\"\(.*\)\",$/\1/p" internal/embed/fetch.go; }
          fetch() {
            name="$(field "$1" Name)"; url="$(field "$1" URL)"; sum="$(field "$1" SHA256)"
            [ -n "$name" ] && [ -n "$url" ] && [ -n "$sum" ] || { echo "cannot read the pinned $1"; exit 1; }
            curl -fsSL -o "$1.tar.gz" "$url"
            echo "$sum  $1.tar.gz" | sha256sum -c - >&2
            tar -xzf "$1.tar.gz"
            echo "$name"
          }
          siglip="$(fetch SigLIP2)"; faces="$(fetch Faces)"
          go="$(sed -n 's/^ARG GO_VERSION=//p' Dockerfile)"
          [ -n "$go" ] || { echo "cannot read the Go version"; exit 1; }
          docker create --name embed "$IMAGE" x >/dev/null
          docker cp embed:/stratus-embed ./stratus-embed
          docker run --rm -v "$PWD":/src -w /src \
            -v "$PWD/stratus-embed":/usr/local/bin/stratus-embed:ro \
            -e STRATUS_TEST_EMBED_MODEL="/src/$siglip" -e STRATUS_TEST_TOKENIZER="/src/$siglip/tokenizer.bin" \
            -e STRATUS_TEST_FACES_MODEL="/src/$faces" \
            -e CGO_ENABLED=0 "golang:$go-alpine" \
            go test -v -run 'TestTheModelGivesWhatPythonGave|TestTheFaceModelsGiveWhatPythonGave|TestTokenizerMatchesTheReference' ./internal/embed/ \
            | tee test.log
          ! grep -q -- '--- SKIP' test.log

      - name: push ${{ matrix.tool }} ${{ matrix.arch }}
        run: docker push "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}-${{ matrix.arch }}"

  # The version tag is a manifest list over the two architecture tags, so the
  # server Dockerfile can COPY --from it without naming an architecture.
  manifest:
    needs: build
    strategy:
      matrix:
        tool: ${{ fromJSON(inputs.tools || '["ffprobe", "ffmpeg", "embed"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: version and image
        id: v
        env:
          OWNER: ${{ github.repository_owner }}
          TOOL: ${{ matrix.tool }}
        run: |
          var=FFMPEG_VERSION
          [ "$TOOL" = embed ] && var=EMBED_VERSION
          version="$(sed -n "s/^ARG $var=//p" "build/$TOOL/Dockerfile")"
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=$version"
            echo "image=ghcr.io/$owner/stratus-$TOOL"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: assemble the manifest
        env:
          IMAGE: ${{ steps.v.outputs.image }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" \
            "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
