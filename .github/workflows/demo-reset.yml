name: demo reset

# The test instance is open on purpose -- its password is the version in its
# footer, which anybody can read off this repository -- so what keeps it from
# being worth abusing is that it forgets everything, every hour.
#
# scripts/demo-reset.sh is the whole of it: it restarts the machine, whose
# memory is the disk and whose image seeds itself as it starts (see
# deploy/demo/fly.toml), checks that what was there is gone and seeds again
# from outside, which is what checks the result. Without a machine to restart
# it builds a new one on what CI last published.
#
# Nothing here upgrades anything; the pipeline in ci.yml is what deploys new
# code, through the same script.
#
# GitHub's schedule is best effort and runs late under load, and it stops
# altogether after sixty days with no push to the repository. Neither matters
# for a demo, and both are why this can be run by hand as well.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# One at a time, and never cancelled halfway: a reset that stopped between the
# deploy and the seeding would leave the demo empty until the next hour.
concurrency:
  group: demo-reset
  cancel-in-progress: false

env:
  FLY_APP: ${{ vars.FLY_APP }}

jobs:
  reset:
    name: reset
    # Nothing to reset where no instance is configured, which is every fork.
    if: vars.FLY_APP != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      # 1.6 and not v1.6; see the deploy job in ci.yml.
      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: empty it and seed the demo media again
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # The address the demo is given out at, where there is one. Empty
          # falls back to the app's own .fly.dev name inside the script.
          DEMO_BASE: ${{ vars.DEMO_BASE }}
        run: ./scripts/demo-reset.sh "$FLY_APP"
