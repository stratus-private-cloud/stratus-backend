# Fly.io: the throwaway instance CI keeps on the last green main.
#
# Test infrastructure, not a recommended way to run this: the fly.toml at the
# root of the repository is the one meant to be launched, and it is kept apart
# from this one so that `fly launch --from` finds that and not this. The
# smallest machine there is, a disk made of its memory, and a password
# written below in the clear.
# Every merge to main is a fresh server with nothing in it but the demo media
# -- and every hour the machine
# empties itself again without changing what it runs. Do not put anything here
# that you would miss.
#
# **The data is in /dev/shm, a tmpfs**, and that is for its size rather than
# its speed. The demo is open to anybody, and the smallest volume Fly sells is
# a gigabyte, nine hundred megabytes of it free for whoever signs in. The
# kernel sizes this one at half the machine's memory -- about 105 MiB here,
# of which the demo media and its thumbnails take some 20 -- and nobody can
# make it bigger by uploading, since the server answers 507 once it is full.
#
# What that costs is that it goes with the machine: a stop, a restart, or Fly
# moving it to another host is an empty server. So the image seeds itself
# every time it starts -- the published one with the demo media and a shell
# laid over it, deploy/demo/Dockerfile -- which makes a restart nobody asked
# for cost about a minute rather than the rest of the hour. The hourly reset
# is the same thing done on purpose, from inside: deploy/demo/entrypoint.sh
# stops the server, empties the directory and starts it again, so it keeps
# time by the machine's clock and not by GitHub's schedule, which runs when it
# likes. A deploy destroys the machine and builds a new one. It is still never stopped for
# being idle, since waking it would be that minute of an empty demo.
#
#   scripts/demo-reset.sh <app>            # restart: empty it and reseed
#   scripts/demo-reset.sh <app> <image>    # deploy that digest
#
# CI deploys this same file, through that script, with the digest it just
# published; see ci.yml.
app = "stratus-demo"
primary_region = "cdg"

# 256 MB is not enough for the first thumbnails after a reset, while the
# indexer reads the same files: the kernel killed the server mid-request and the
# proxy answered 502. Swap takes the spike more slowly instead.
swap_size_mb = 512

# The entrypoint exits when the server dies, and the machine has to come back
# whatever the status was.
[[restart]]
  policy = "always"

[build]
  # The published image with the seeding laid over it. scripts/demo-reset.sh
  # passes the path again with the repository root as the context, and the
  # digest to build on as IMAGE; without one it builds on :main.
  dockerfile = "Dockerfile"

[env]
  STRATUS_ADDR = ":8080"
  STRATUS_DATA_DIR = "/dev/shm/stratus"
  # Not secrets, and the seeding step reads both from here so there is one
  # place that says how to sign in. The password is fixed so that a client, or
  # a store reviewer, handed it days ago still gets in.
  STRATUS_USERNAME = "demo"
  STRATUS_PASSWORD = "stratus-private-cloud"
  # The demo is seeded seconds after the machine starts, and a minute of waiting
  # for the indexer would make the music look missing. Nothing else about this
  # instance is tuned.
  STRATUS_INDEX_INTERVAL = "5s"
  # Every other editable setting at its default, because a variable that is
  # set is one the settings page shows and does not offer (#397): the demo is
  # open to anybody, and one visitor turning music lookup on or the log level
  # to debug would be the next visitor's demo.
  STRATUS_TRASH_RETENTION = "720h"
  STRATUS_GC_INTERVAL = "24h"
  STRATUS_GC_GRACE = "1h"
  STRATUS_THUMBS_AHEAD = "on"
  STRATUS_INCOMING_INTERVAL = "1m"
  STRATUS_VIDEO_TRANSCODE = "auto"
  STRATUS_MUSIC_LOOKUP = "off"
  TZ = "UTC"
  STRATUS_WEEK_START = "monday"
  STRATUS_LOG_LEVEL = "info"
  STRATUS_BACKUP_INTERVAL = "24h"
  STRATUS_BACKUP_DIR = "stratus-db-backups"
  # Read by the Sentry SDK itself, so the demo's errors can be told apart from
  # a real install's in the same project. The DSN is a Fly secret.
  SENTRY_ENVIRONMENT = "demo"

[http_service]
  internal_port = 8080
  # Fly terminates TLS and forwards the scheme, which is what makes the session
  # cookie Secure -- see overTLS in internal/web.
  force_https = true
  # Never stopped for being idle: a stop empties the tmpfs, see the top.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
